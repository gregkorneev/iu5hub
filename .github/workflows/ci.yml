name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run search:validate
      - run: npm run search:build:check
      - run: npm run search:tagging-queue:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy-cloudru:
    needs: verify
    # Enable only after the dedicated production bucket and environment secrets exist.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDRU_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudru-production
    concurrency:
      group: cloudru-production
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central-1
      AWS_EC2_METADATA_DISABLED: 'true'
      CLOUDRU_BUCKET: ${{ secrets.CLOUDRU_BUCKET }}
      CLOUDRU_PREFIX: ${{ vars.CLOUDRU_PREFIX }}
      CLOUDRU_S3_ENDPOINT: https://s3.cloud.ru
      VITE_ANALYTICS_API_BASE: ${{ vars.VITE_ANALYTICS_API_BASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$CLOUDRU_BUCKET"
          test -n "$VITE_ANALYTICS_API_BASE"
          node scripts/validate-analytics-api-base.mjs
          if [ -n "$CLOUDRU_PREFIX" ]; then
            if ! [[ "$CLOUDRU_PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$CLOUDRU_PREFIX" == *..* ]]; then
              echo 'CLOUDRU_PREFIX must be a relative object-key prefix without ..'
              exit 1
            fi
          fi

      - run: npm run build
      - run: cp dist/index.html dist/error.html

      - name: Publish static build to Cloud.ru Object Storage
        shell: bash
        run: |
          set -euo pipefail
          target="s3://$CLOUDRU_BUCKET"
          if [ -n "$CLOUDRU_PREFIX" ]; then target="$target/$CLOUDRU_PREFIX"; fi
          aws --version
          aws s3 sync dist/assets/ "$target/assets/" --endpoint-url "$CLOUDRU_S3_ENDPOINT" --delete --cache-control 'public, max-age=31536000, immutable' --only-show-errors
          aws s3 sync dist/ "$target/" --endpoint-url "$CLOUDRU_S3_ENDPOINT" --delete --exclude 'assets/*' --exclude index.html --cache-control 'no-cache' --only-show-errors
          aws s3 cp dist/index.html "$target/index.html" --endpoint-url "$CLOUDRU_S3_ENDPOINT" --cache-control 'no-cache, no-store, must-revalidate' --only-show-errors

  deploy-cloudflare-pages:
    needs: verify
    # Enable only after the Cloudflare Pages project and repository secrets exist.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      VITE_ANALYTICS_API_BASE: ${{ vars.VITE_ANALYTICS_API_BASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/validate-cloudflare-pages-config.mjs
      - run: npm run build
      - run: npx --yes wrangler@4 pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
