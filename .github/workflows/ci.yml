name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-cloudru:
    needs: verify
    # Enable only after the dedicated production bucket and environment secrets exist.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDRU_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudru-production
    concurrency:
      group: cloudru-production
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central-1
      AWS_EC2_METADATA_DISABLED: 'true'
      CLOUDRU_BUCKET: ${{ vars.CLOUDRU_BUCKET }}
      CLOUDRU_PREFIX: ${{ vars.CLOUDRU_PREFIX }}
      CLOUDRU_S3_ENDPOINT: https://s3.cloud.ru

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$CLOUDRU_BUCKET"
          if [ -n "$CLOUDRU_PREFIX" ] && ! [[ "$CLOUDRU_PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$CLOUDRU_PREFIX" == *..* ]]; then
            echo 'CLOUDRU_PREFIX must be a relative object-key prefix without ..'
            exit 1
          fi

      - name: Publish static build to Cloud.ru Object Storage
        shell: bash
        run: |
          set -euo pipefail
          target="s3://$CLOUDRU_BUCKET"
          if [ -n "$CLOUDRU_PREFIX" ]; then target="$target/$CLOUDRU_PREFIX"; fi
          aws s3 sync dist/ "$target/" --endpoint-url "$CLOUDRU_S3_ENDPOINT" --delete --exclude index.html --only-show-errors
          aws s3 cp dist/index.html "$target/index.html" --endpoint-url "$CLOUDRU_S3_ENDPOINT" --cache-control 'no-cache, no-store, must-revalidate' --only-show-errors
